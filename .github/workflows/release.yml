name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: macos
            arch: x86_64
            runner: macos-15-intel
          - os_name: macos
            arch: arm64
            runner: macos-14
          - os_name: linux
            arch: x86_64
            runner: ubuntu-24.04
          - os_name: linux
            arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.os_name }}-${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          pkg_dir="shimback-${{ matrix.os_name }}-${{ matrix.arch }}"
          mkdir -p "$pkg_dir"
          cp build/shimback "$pkg_dir/"
          cp man/shimback.1 "$pkg_dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$pkg_dir/"
          tar -czf "$pkg_dir.tar.gz" "$pkg_dir"

      # Re-derives everything from the tarball itself, on the same runner
      # (so same OS/arch the release actually ships), rather than trusting
      # the in-tree build dir -- catches a wrong archive layout, missing
      # man page, bad permissions, or a mismatch with what install.sh
      # expects, before it ever reaches upload-artifact/the release.
      - name: Smoke-test the packaged archive
        run: |
          set -eu
          pkg_dir="shimback-${{ matrix.os_name }}-${{ matrix.arch }}"
          smoke_dir="$(mktemp -d)"
          tar -xzf "$pkg_dir.tar.gz" -C "$smoke_dir"
          extracted="$smoke_dir/$pkg_dir"

          [ -x "$extracted/shimback" ] || { echo "::error::missing or non-executable shimback binary in the packaged archive"; exit 1; }
          [ -f "$extracted/shimback.1" ] || { echo "::error::missing man page in the packaged archive"; exit 1; }
          [ -f "$extracted/README.md" ] || { echo "::error::missing README.md in the packaged archive"; exit 1; }

          version_out="$("$extracted/shimback" --version)"
          case "$version_out" in
            shimback\ *) ;;
            *) echo "::error::packaged binary's --version output looks wrong: $version_out"; exit 1 ;;
          esac
          echo "packaged binary reports: $version_out"

          install_prefix="$(mktemp -d)"
          "$extracted/shimback" install --prefix "$install_prefix" --shell zsh
          [ -x "$install_prefix/bin/shimback" ] || { echo "::error::install did not place a binary at <prefix>/bin/shimback"; exit 1; }
          [ -f "$install_prefix/share/man/man1/shimback.1" ] || { echo "::error::install did not place the man page"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: shimback-${{ matrix.os_name }}-${{ matrix.arch }}
          path: shimback-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz

  # Windows x86_64 (ARM64 deferred -- see windows-port.md's "Resolved
  # decisions"). A separate job rather than another matrix leg on `build`
  # above: every step here needs its own PowerShell/toolchain/packaging
  # logic, not just a different shell for the same commands, so folding it
  # into the shared macOS/Linux step list via `if: runner.os == 'Windows'`
  # on each one would be messier than just keeping it apart.
  build-windows:
    runs-on: windows-2025
    name: build (windows-x86_64)

    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      # xwin (https://github.com/Jake-Shadle/xwin) splats an MSVC/Windows
      # SDK sysroot without a full Visual Studio install -- see
      # windows-port.md's Phase 1 for why this project builds with
      # clang-cl/lld-link against a splatted sysroot rather than MSVC's
      # own cl.exe/link.exe directly. `cargo install` rather than pinning
      # a prebuilt-binary download URL: Rust/cargo already ships on
      # GitHub's windows runners, and this avoids a release-asset URL
      # that could silently break if xwin's own artifact naming changes.
      - name: Install xwin
        run: cargo install xwin --locked

      # D:\, not C:\ -- xwin moves (renames) files from its cache into the
      # splat output as a fast path, and the checkout/work directory on
      # GitHub's windows runners lives on D:\ (confirmed directly: a first
      # attempt at C:\msvc-sysroot failed with "The system cannot move the
      # file to a different disk drive" -- the exact EXDEV-class problem
      # this whole port spent a lot of time on elsewhere, this time hitting
      # xwin itself rather than shimback).
      - name: Splat MSVC/Windows SDK sysroot
        run: xwin --accept-license splat --output D:\msvc-sysroot

      # Temporary: the toolchain file expects exactly one version directory
      # under VC\Tools\MSVC and one under 'Windows Kits\10\Include' (see
      # cmake/windows-clang-cl.cmake), matching xwin's splat layout as
      # tested locally -- but the Configure step below is failing that
      # exact check on this runner, so print what xwin actually produced
      # here before guessing why.
      - name: Debug sysroot layout
        shell: pwsh
        run: |
          Get-ChildItem D:\msvc-sysroot | Format-Table Name
          Get-ChildItem "D:\msvc-sysroot\VC\Tools\MSVC" -ErrorAction SilentlyContinue | Format-Table Name
          Get-ChildItem "D:\msvc-sysroot\Windows Kits\10\Include" -ErrorAction SilentlyContinue | Format-Table Name

      # clang-cl/lld-link ship as part of the LLVM install already present
      # on GitHub's windows-2025 runner image, at this same path used for
      # local development (see windows-port.md Phase 1) -- not installed
      # separately here. CMAKE_TOOLCHAIN_FILE is quoted -- confirmed the
      # hard way, both here and earlier during local setup, that pwsh (the
      # default shell for `run:` steps on this runner) mangles an unquoted
      # `cmake/windows-clang-cl.cmake` value, which CMake then reports as
      # "Could not find toolchain file: cmake/windows-clang-cl" (the
      # trailing ".cmake" silently dropped).
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=cmake/windows-clang-cl.cmake" -DSHIMBACK_LLVM_BIN="C:\Program Files\LLVM\bin" -DSHIMBACK_MSVC_SYSROOT="D:\msvc-sysroot"

      - name: Build
        run: cmake --build build --config Release

      # No `ctest` step here: the existing test suite (tests/*.sh) is
      # entirely POSIX-shell/symlink-based, predating this port, and a
      # Windows-native equivalent (Pester, per windows-port.md Phase 8) is
      # still owed, not yet written -- running the POSIX suite as-is here
      # would fail on assumptions (symlinks, `.exe`-less names) this port
      # deliberately doesn't share, not on anything actually broken. The
      # smoke test below is this job's real correctness gate for now.
      - name: Package
        shell: pwsh
        run: |
          $pkgDir = "shimback-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          Copy-Item build\shimback.exe $pkgDir\
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $pkgDir\
          Compress-Archive -Path $pkgDir -DestinationPath "$pkgDir.zip" -Force

      # Mirrors the macOS/Linux smoke test above (re-derive everything
      # from the packaged archive itself, on the same runner, rather than
      # trusting the in-tree build dir): no man page (Windows builds don't
      # ship one, see windows-port.md Phase 7), `.exe`-suffixed binary,
      # and install.ps1's own expected archive layout
      # (shimback-windows-x86_64\shimback.exe) checked directly.
      - name: Smoke-test the packaged archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkgDir = "shimback-windows-x86_64"
          $smokeDir = Join-Path $env:TEMP ("shimback-smoke." + [System.IO.Path]::GetRandomFileName())
          Expand-Archive -LiteralPath "$pkgDir.zip" -DestinationPath $smokeDir
          $extracted = Join-Path $smokeDir $pkgDir

          if (-not (Test-Path "$extracted\shimback.exe")) { Write-Error "missing shimback.exe in the packaged archive"; exit 1 }
          if (-not (Test-Path "$extracted\README.md")) { Write-Error "missing README.md in the packaged archive"; exit 1 }

          $versionOut = & "$extracted\shimback.exe" --version
          if ($versionOut -notmatch "^shimback ") { Write-Error "packaged binary's --version output looks wrong: $versionOut"; exit 1 }
          Write-Host "packaged binary reports: $versionOut"

          $installPrefix = Join-Path $env:TEMP ("shimback-install-smoke." + [System.IO.Path]::GetRandomFileName())
          & "$extracted\shimback.exe" install --prefix $installPrefix
          if (-not (Test-Path "$installPrefix\bin\shimback.exe")) { Write-Error "install did not place a binary at <prefix>\bin\shimback.exe"; exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: shimback-windows-x86_64
          path: shimback-windows-x86_64.zip

  release:
    needs: [build, build-windows]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: shasum -a 256 *.tar.gz *.zip > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/*.tar.gz artifacts/*.zip artifacts/SHA256SUMS man/shimback.1 \
            --generate-notes
