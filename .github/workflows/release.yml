name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: macos
            arch: x86_64
            runner: macos-15-intel
          - os_name: macos
            arch: arm64
            runner: macos-14
          - os_name: linux
            arch: x86_64
            runner: ubuntu-24.04
          - os_name: linux
            arch: arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    name: build (${{ matrix.os_name }}-${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          pkg_dir="shimback-${{ matrix.os_name }}-${{ matrix.arch }}"
          mkdir -p "$pkg_dir"
          cp build/shimback "$pkg_dir/"
          cp man/shimback.1 "$pkg_dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$pkg_dir/"
          tar -czf "$pkg_dir.tar.gz" "$pkg_dir"

      # Re-derives everything from the tarball itself, on the same runner
      # (so same OS/arch the release actually ships), rather than trusting
      # the in-tree build dir -- catches a wrong archive layout, missing
      # man page, bad permissions, or a mismatch with what install.sh
      # expects, before it ever reaches upload-artifact/the release.
      - name: Smoke-test the packaged archive
        run: |
          set -eu
          pkg_dir="shimback-${{ matrix.os_name }}-${{ matrix.arch }}"
          smoke_dir="$(mktemp -d)"
          tar -xzf "$pkg_dir.tar.gz" -C "$smoke_dir"
          extracted="$smoke_dir/$pkg_dir"

          [ -x "$extracted/shimback" ] || { echo "::error::missing or non-executable shimback binary in the packaged archive"; exit 1; }
          [ -f "$extracted/shimback.1" ] || { echo "::error::missing man page in the packaged archive"; exit 1; }
          [ -f "$extracted/README.md" ] || { echo "::error::missing README.md in the packaged archive"; exit 1; }

          version_out="$("$extracted/shimback" --version)"
          case "$version_out" in
            shimback\ *) ;;
            *) echo "::error::packaged binary's --version output looks wrong: $version_out"; exit 1 ;;
          esac
          echo "packaged binary reports: $version_out"

          install_prefix="$(mktemp -d)"
          "$extracted/shimback" install --prefix "$install_prefix" --shell zsh
          [ -x "$install_prefix/bin/shimback" ] || { echo "::error::install did not place a binary at <prefix>/bin/shimback"; exit 1; }
          [ -f "$install_prefix/share/man/man1/shimback.1" ] || { echo "::error::install did not place the man page"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: shimback-${{ matrix.os_name }}-${{ matrix.arch }}
          path: shimback-${{ matrix.os_name }}-${{ matrix.arch }}.tar.gz

      # A real .deb, for manual `dpkg -i` install -- both Linux legs (not
      # macOS), each producing the native dpkg architecture for that
      # runner. Builds from a from-scratch extracted copy of the source
      # (the "3.0 (quilt)" format's own convention: an upstream tarball +
      # the debian/ overlay, not whatever's sitting in this job's own
      # build/ dir above) -- debhelper owns that build directory's naming
      # and lifecycle itself, so sharing it with the plain cmake build
      # above would fight the tool rather than save meaningful time; the
      # whole dpkg-buildpackage cycle, including its own full `ctest` run,
      # takes under two minutes.
      #
      # debian/changelog's version comes from VERSION at build time via
      # `dch`, not a second, independently-driftable copy of the version
      # hand-maintained in git -- same reasoning as the VERSION-vs-git-tag
      # gap already tracked for this project's packaging work generally.
      - name: Build .deb
        if: matrix.os_name == 'linux'
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq debhelper devscripts lintian

          version="$(cat VERSION)"
          git archive --format=tar.gz --prefix="shimback-${version}/" -o "/tmp/shimback_${version}.orig.tar.gz" HEAD -- . ':!debian'

          build_dir="$(mktemp -d)"
          tar -xzf "/tmp/shimback_${version}.orig.tar.gz" -C "$build_dir"
          cp -r debian "$build_dir/shimback-${version}/debian"
          cd "$build_dir/shimback-${version}"

          export DEBFULLNAME="Pablo Navais"
          export DEBEMAIL="pnavais@gmail.com"
          dch --create --package shimback --newversion "${version}-1" --distribution unstable --urgency medium "Automated packaging build."

          dpkg-buildpackage -us -uc -b

          deb_path="$(ls "$build_dir"/shimback_*.deb)"
          echo "DEB_PATH=$deb_path" >> "$GITHUB_ENV"

      # lintian clean (the one expected note on a first, non-archive
      # upload, "initial-upload-closes-no-bugs", is not a real defect --
      # confirmed by actually running lintian against a real build, not
      # assumed), then a real install/uninstall cycle, same spirit as the
      # tarball's own smoke test above.
      - name: Smoke-test the .deb
        if: matrix.os_name == 'linux'
        run: |
          set -eu
          lintian "$DEB_PATH" || true
          sudo dpkg -i "$DEB_PATH"
          [ -x /usr/bin/shimback ] || { echo "::error::.deb did not install a binary at /usr/bin/shimback"; exit 1; }
          [ -f /usr/share/man/man1/shimback.1.gz ] || { echo "::error::.deb did not install the man page"; exit 1; }
          version_out="$(shimback --version)"
          case "$version_out" in
            shimback\ *) ;;
            *) echo "::error::.deb-installed binary's --version output looks wrong: $version_out"; exit 1 ;;
          esac
          echo "installed binary reports: $version_out"
          sudo dpkg -r shimback

      - uses: actions/upload-artifact@v7
        if: matrix.os_name == 'linux'
        with:
          name: shimback-deb-${{ matrix.arch }}
          path: ${{ env.DEB_PATH }}

  # Windows x86_64 and arm64. ARM64 was deferred for a long time (see git
  # history's now-folded-in windows-port.md "Resolved decisions") purely
  # because there was no way to run this job's Pester suite on real Windows
  # ARM64 hardware in CI -- cross-compiling it was proven working from the
  # start (a hello-world binary's PE header confirmed as genuine
  # IMAGE_FILE_MACHINE_ARM64). GitHub's windows-11-arm hosted runners (GA,
  # free for public repos) close that gap, so this is now a matrix over the
  # two Windows arches -- unlike the Windows-vs-macOS/Linux split above,
  # these two legs share every single step, just a different runner,
  # target triple, xwin --arch, and asset name.
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            xwin_arch: x86_64
          - arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            # xwin's own vocabulary is "aarch64", not "arm64" -- matches
            # `matrix.target`'s triple, kept as its own field since the
            # package/asset name below deliberately uses "arm64" instead,
            # for consistency with the macOS/Linux arm64 asset names above.
            xwin_arch: aarch64

    runs-on: ${{ matrix.runner }}
    name: build (windows-${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      # xwin (https://github.com/Jake-Shadle/xwin) splats an MSVC/Windows
      # SDK sysroot without a full Visual Studio install -- see the
      # toolchain file (cmake/windows-clang-cl.cmake) for why this project
      # builds with clang-cl/lld-link against a splatted sysroot rather
      # than MSVC's own cl.exe/link.exe directly. `cargo install` rather
      # than pinning a prebuilt-binary download URL: Rust/cargo already
      # ships on GitHub's windows runners (both x86_64 and arm64), and this
      # avoids a release-asset URL that could silently break if xwin's own
      # artifact naming changes.
      - name: Install xwin
        run: cargo install xwin --locked

      # $env:RUNNER_TEMP, not a hardcoded drive letter -- xwin moves
      # (renames) files from its cache into the splat output as a fast
      # path, which fails across drives ("The system cannot move the file
      # to a different disk drive", the exact EXDEV-class problem this
      # whole port spent a lot of time on elsewhere, that time hitting
      # xwin itself rather than shimback). The fix isn't "use D:\" as such
      # -- it's "use whatever drive this job's own scratch space is
      # already on", which is exactly what RUNNER_TEMP is *for* and is
      # guaranteed to be (that's why GitHub puts it, and the checkout, on
      # D:\ on windows-2025 in the first place). A hardcoded `D:\msvc-
      # sysroot` was tried here first and confirmed, for real, to fail
      # outright on windows-11-arm ("The system cannot find the path
      # specified" -- no D:\ drive exists on that image at all), which is
      # exactly the kind of per-runner-image assumption this rewrite stops
      # needing to make.
      - name: Splat MSVC/Windows SDK sysroot
        shell: pwsh
        run: xwin --accept-license --http-retry 3 --arch ${{ matrix.xwin_arch }} splat --output "$env:RUNNER_TEMP\msvc-sysroot"

      # clang-cl/lld-link ship as part of the LLVM install already present
      # on GitHub's windows runner images, at this same path -- confirmed
      # directly for windows-2025 and, per the same build pipeline
      # producing both images, assumed (not yet independently confirmed)
      # to hold for windows-11-arm too. Not installed separately here.
      # CMAKE_TOOLCHAIN_FILE is quoted -- confirmed the hard way, both here
      # and earlier during local setup, that pwsh (the default shell for
      # `run:` steps on these runners) mangles an unquoted
      # `cmake/windows-clang-cl.cmake` value, which CMake then reports as
      # "Could not find toolchain file: cmake/windows-clang-cl" (the
      # trailing ".cmake" silently dropped).
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_TOOLCHAIN_FILE=cmake/windows-clang-cl.cmake" -DSHIMBACK_LLVM_BIN="C:\Program Files\LLVM\bin" -DSHIMBACK_MSVC_SYSROOT="$env:RUNNER_TEMP\msvc-sysroot" -DSHIMBACK_WIN_TARGET=${{ matrix.target }}

      - name: Build
        run: cmake --build build --config Release

      # No `ctest` step here: the existing test suite (tests/*.sh) is
      # entirely POSIX-shell/symlink-based, predating this port, and would
      # fail on assumptions (symlinks, `.exe`-less names) this port
      # deliberately doesn't share, not on anything actually broken. The
      # Windows-native Pester suite below (tests/windows/) is this job's
      # real correctness gate instead -- and, for the arm64 leg
      # specifically, the reason this needs a native windows-11-arm runner
      # in the first place: an ARM64 Windows binary can't run on x86_64
      # Windows at all (no such emulation direction exists), so there's no
      # way to actually exercise it short of real ARM64 hardware.
      #
      # Pinned via -RequiredVersion, not whatever this runner image already
      # has -- same reasoning as xwin's own --locked install above.
      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -RequiredVersion 5.6.1 -Force -SkipPublisherCheck -Scope CurrentUser

      # SHIMBACK_TEST_REAL_SHELL=1: this runner is a fresh, disposable VM,
      # so the specs that mutate the real PowerShell profile / cmd.exe
      # AutoRun / HKCU\Environment\Path (safe here, not for a local dev
      # machine -- see tests/windows/Common.ps1's own header comment) run
      # for real, not skipped.
      - name: Run Windows Pester suite
        shell: pwsh
        env:
          SHIMBACK_EXE: build\shimback.exe
          SHIMBACK_TEST_REAL_SHELL: "1"
        run: |
          Import-Module Pester -RequiredVersion 5.6.1 -Force
          $config = New-PesterConfiguration
          $config.Run.Path = "tests/windows"
          $config.Run.PassThru = $true
          $config.Output.Verbosity = "Detailed"
          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
            throw "$($result.FailedCount) Pester test(s) failed"
          }

      - name: Package
        shell: pwsh
        run: |
          $pkgDir = "shimback-windows-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path $pkgDir | Out-Null
          Copy-Item build\shimback.exe $pkgDir\
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $pkgDir\
          Compress-Archive -Path $pkgDir -DestinationPath "$pkgDir.zip" -Force

      # Mirrors the macOS/Linux smoke test above (re-derive everything
      # from the packaged archive itself, on the same runner, rather than
      # trusting the in-tree build dir): no man page (Windows builds don't
      # ship one), `.exe`-suffixed binary, and install.ps1's own expected
      # archive layout (shimback-windows-<arch>\shimback.exe) checked
      # directly.
      - name: Smoke-test the packaged archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pkgDir = "shimback-windows-${{ matrix.arch }}"
          $smokeDir = Join-Path $env:TEMP ("shimback-smoke." + [System.IO.Path]::GetRandomFileName())
          Expand-Archive -LiteralPath "$pkgDir.zip" -DestinationPath $smokeDir
          $extracted = Join-Path $smokeDir $pkgDir

          if (-not (Test-Path "$extracted\shimback.exe")) { Write-Error "missing shimback.exe in the packaged archive"; exit 1 }
          if (-not (Test-Path "$extracted\README.md")) { Write-Error "missing README.md in the packaged archive"; exit 1 }

          $versionOut = & "$extracted\shimback.exe" --version
          if ($versionOut -notmatch "^shimback ") { Write-Error "packaged binary's --version output looks wrong: $versionOut"; exit 1 }
          Write-Host "packaged binary reports: $versionOut"

          $installPrefix = Join-Path $env:TEMP ("shimback-install-smoke." + [System.IO.Path]::GetRandomFileName())
          & "$extracted\shimback.exe" install --prefix $installPrefix
          if (-not (Test-Path "$installPrefix\bin\shimback.exe")) { Write-Error "install did not place a binary at <prefix>\bin\shimback.exe"; exit 1 }

      - uses: actions/upload-artifact@v7
        with:
          name: shimback-windows-${{ matrix.arch }}
          path: shimback-windows-${{ matrix.arch }}.zip

  # Statically-linked musl variant: a single binary with zero runtime
  # dependencies, portable to any Linux (including minimal/Alpine/scratch
  # containers) regardless of its own glibc/musl version. Zig (zig cc
  # -target <arch>-linux-musl) over Ubuntu's musl-tools apt package --
  # Zig bundles its own versioned musl sysroot, the same "fetch our own
  # pinned toolchain rather than rely on whatever the OS package manager
  # happens to carry" choice already made for Windows (xwin's splatted
  # sysroot, below). Each leg runs on its own native per-arch runner, same
  # as the plain Linux legs above and the Windows job's own per-arch
  # structure -- deliberately *not* cross-compiling both targets from one
  # host, even though Zig can: a cross-compiled aarch64 binary couldn't
  # then run `ctest` natively on an x86_64 host (no QEMU in this
  # workflow), which would be a real step down from this project's
  # standing discipline of testing every built artifact natively (the
  # same reason the Windows arm64 leg runs on real windows-11-arm hardware
  # rather than being cross-compiled).
  build-musl:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            zig_target: x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            arch: arm64
            zig_target: aarch64-linux-musl

    runs-on: ${{ matrix.runner }}
    name: build (linux-musl-${{ matrix.arch }})

    steps:
      - uses: actions/checkout@v7

      # Zig ships as a plain tarball, not a marketplace action -- same
      # "install from the canonical source directly" preference as xwin's
      # own `cargo install` below. Pinned to a specific release (not
      # "latest"), confirmed against ziglang.org/download/index.json at
      # the time this was written (0.16.0, the secondhand version this
      # workflow's own design doc first guessed, turned out to already be
      # one release behind by the time this was actually implemented --
      # confirming the index.json rather than trusting that guess is
      # exactly why this step checks it directly instead of hardcoding
      # from memory).
      - name: Install Zig
        run: |
          set -eu
          zig_version="0.17.0"
          host_arch="$(uname -m)"
          curl -fsSL "https://ziglang.org/download/${zig_version}/zig-${host_arch}-linux-${zig_version}.tar.xz" -o /tmp/zig.tar.xz
          mkdir -p /tmp/zig
          tar -xJf /tmp/zig.tar.xz -C /tmp/zig --strip-components=1
          echo "/tmp/zig" >> "$GITHUB_PATH"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/linux-zig-musl.cmake -DSHIMBACK_ZIG_BIN=/tmp/zig -DSHIMBACK_ZIG_TARGET=${{ matrix.zig_target }} -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # Nothing else in this workflow checks linkage either way -- worth
      # doing here specifically, since "actually static" is the one
      # property this whole leg exists to guarantee and the build
      # succeeding alone doesn't prove it (a silently-dynamic musl binary
      # would still build and run fine on this same runner).
      - name: Verify the binary is actually static
        run: |
          set -eu
          file build/shimback
          if ldd build/shimback; then
            echo "::error::build/shimback is dynamically linked -- the musl variant must be fully static"
            exit 1
          fi

      - name: Package
        run: |
          pkg_dir="shimback-linux-musl-${{ matrix.arch }}"
          mkdir -p "$pkg_dir"
          cp build/shimback "$pkg_dir/"
          cp man/shimback.1 "$pkg_dir/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$pkg_dir/"
          tar -czf "$pkg_dir.tar.gz" "$pkg_dir"

      - name: Smoke-test the packaged archive
        run: |
          set -eu
          pkg_dir="shimback-linux-musl-${{ matrix.arch }}"
          smoke_dir="$(mktemp -d)"
          tar -xzf "$pkg_dir.tar.gz" -C "$smoke_dir"
          extracted="$smoke_dir/$pkg_dir"

          [ -x "$extracted/shimback" ] || { echo "::error::missing or non-executable shimback binary in the packaged archive"; exit 1; }
          [ -f "$extracted/shimback.1" ] || { echo "::error::missing man page in the packaged archive"; exit 1; }
          [ -f "$extracted/README.md" ] || { echo "::error::missing README.md in the packaged archive"; exit 1; }

          version_out="$("$extracted/shimback" --version)"
          case "$version_out" in
            shimback\ *) ;;
            *) echo "::error::packaged binary's --version output looks wrong: $version_out"; exit 1 ;;
          esac
          echo "packaged binary reports: $version_out"

          install_prefix="$(mktemp -d)"
          "$extracted/shimback" install --prefix "$install_prefix" --shell zsh
          [ -x "$install_prefix/bin/shimback" ] || { echo "::error::install did not place a binary at <prefix>/bin/shimback"; exit 1; }
          [ -f "$install_prefix/share/man/man1/shimback.1" ] || { echo "::error::install did not place the man page"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: shimback-linux-musl-${{ matrix.arch }}
          path: shimback-linux-musl-${{ matrix.arch }}.tar.gz

  release:
    needs: [build, build-windows, build-musl]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: shasum -a 256 *.tar.gz *.zip *.deb > SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/*.tar.gz artifacts/*.zip artifacts/*.deb artifacts/SHA256SUMS man/shimback.1 \
            --generate-notes
